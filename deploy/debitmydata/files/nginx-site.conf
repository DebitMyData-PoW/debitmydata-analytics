# DebitMyData Analytics: @HOST@, behind Cloudflare (proxied). bitviewd answers on 127.0.0.1:3110.
# Visitors' real addresses: conf.d/cloudflare-real-ip.conf (cloudflare.sh).

# A visitor's requests: Studio asks for many series at once, so a generous burst.
limit_req_zone $binary_remote_addr zone=dmd_analytics:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name @HOST@;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @HOST@;
    server_tokens off;

    # Cloudflare origin certificate (SSL/TLS mode "Full (strict)").
    ssl_certificate @CERT@;
    ssl_certificate_key @KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    limit_req_status 429;

    # The server's own log, live: not public.
    location = /api/server/logs {
        return 404;
    }

    # The pools' logos and their list for the pages, as dmd-pools.timer keeps them from GitHub
    # (pools.sh): pictures only, never run as a page. Else bitviewd's own.
    location ^~ /assets/pools/ {
        root /var/lib/debitmydata-analytics/pools/site;
        try_files $uri @bitviewd;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'none'; img-src data:; style-src 'unsafe-inline'; sandbox" always;
    }

    location @bitviewd {
        limit_req zone=dmd_analytics burst=300 nodelay;
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=dmd_analytics burst=300 nodelay;
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
